name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["state/**", "README.md"]
  pull_request:
    paths-ignore: ["state/**", "README.md"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python tests.py
