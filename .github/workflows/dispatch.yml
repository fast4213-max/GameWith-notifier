name: GameWith Discord Notifier

on:
  repository_dispatch:
    types: [run-notify, init-notify, test-notify]
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        type: choice
        options: [run-notify, init-notify, test-notify]
        default: run-notify

permissions:
  contents: write

# 外部cronとworkflow_dispatchが重なって同時実行されると、同じ新着を2回通知したうえ
# stateのpushが衝突する。実行中のジョブは打ち切らず、直列に流す。
concurrency:
  group: gamewith-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: echo "mode=${{ github.event.action || inputs.mode || 'run-notify' }}" >> "$GITHUB_OUTPUT"

      - name: Run notifier (通常実行)
        if: steps.mode.outputs.mode == 'run-notify'
        env:
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
          DISCORD_WEBHOOK_RELEASE_SCHEDULE: ${{ secrets.DISCORD_WEBHOOK_RELEASE_SCHEDULE }}
          DISCORD_WEBHOOK_NEW_TITLES: ${{ secrets.DISCORD_WEBHOOK_NEW_TITLES }}
        run: python main.py

      - name: Run init (初回既読化・通知なし)
        if: steps.mode.outputs.mode == 'init-notify'
        run: python init_state.py

      - name: Run test notify (疎通確認)
        if: steps.mode.outputs.mode == 'test-notify'
        env:
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
          DISCORD_WEBHOOK_RELEASE_SCHEDULE: ${{ secrets.DISCORD_WEBHOOK_RELEASE_SCHEDULE }}
          DISCORD_WEBHOOK_NEW_TITLES: ${{ secrets.DISCORD_WEBHOOK_NEW_TITLES }}
        run: python test_notify.py

      # always() が無いと main.py が異常終了した際にこのステップごとスキップされ、
      # 「通知は送ったのにstateが保存されない」＝次回実行で同じ通知が再送される状態になる。
      - name: Commit state changes
        if: always() && steps.mode.outputs.mode != 'test-notify'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "stateに変更なし"
            exit 0
          fi
          git commit -m "chore: update state [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "push成功（試行${attempt}回目）"
              exit 0
            fi
            echo "push失敗。リモートの変更を取り込んで再試行します（試行${attempt}回目）"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((attempt * 2))
          done
          echo "::error::stateのpushに失敗しました"
          exit 1
